name: Quality Gate

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    name: Format and iOS bundle export
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.17.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository verification
        run: npm run verify
